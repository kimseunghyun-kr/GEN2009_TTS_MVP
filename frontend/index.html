<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scene Burst Describer (BYO Gemini Key)</title>
    <style>
      :root { color-scheme: dark light; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; }
      .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      .stack { display: grid; gap: 16px; max-width: 720px; }
      .label { font-weight: 600; }
      .btn { padding: 8px 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; cursor: pointer; }
      .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
      #status { min-height: 1.5em; color: #888; }
      #cam { width: 320px; height: 240px; background: #000; }
      #output { white-space: pre-wrap; border: 1px solid #333; padding: 12px; border-radius: 8px; min-height: 3.5em; }
      input[type="password"] { width: 320px; padding: 8px; }
    </style>
  </head>
  <body>
    <main class="stack" aria-labelledby="title">
      <h1 id="title">Scene Burst Describer</h1>

      <section>
        <label for="apiKey" class="label">AI Studio API key</label>
        <div class="row">
          <input id="apiKey" type="password" autocomplete="off" placeholder="AIza…" />
          <button id="start" class="btn">Start Burst</button>
          <button id="stop" class="btn" disabled>Stop</button>
        </div>
        <div id="status" role="status" aria-live="polite"></div>
      </section>

      <section class="row">
        <video id="cam" playsinline muted></video>
        <div style="flex:1; min-width: 240px;">
          <div class="label">Result</div>
          <div id="output"></div>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
