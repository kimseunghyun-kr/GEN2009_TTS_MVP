<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scene Burst Describer (BYO Gemini Key)</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <h1>Scene Burst Describer</h1>

    <div class="grid">
      <!-- Left: Controls & camera -->
      <section class="card">
        <div class="kvs">
          <div class="kv">
            <label for="apiKey">AI Studio API key</label>
            <input id="apiKey" type="password" autocomplete="off" placeholder="AIza…" />
          </div>
          <div class="kv">
            <label for="detail">Detail level</label>
            <select id="detail">
              <option value="concise" selected>Concise (1–2 sentences)</option>
              <option value="detailed">Detailed (artwork/scene)</option>
            </select>
          </div>
          <div class="kv">
            <label for="ttsMode">TTS engine</label>
            <select id="ttsMode">
              <option value="webspeech" selected>Browser (Web Speech)</option>
              <option value="remote">Remote / server TTS</option>
            </select>
            <small class="hint">Remote expects POST /api/tts → { audioUrl }</small>
          </div>
          <div class="kv">
            <label for="rate">TTS rate</label>
            <input id="rate" type="range" min="0.8" max="1.4" step="0.1" value="1.0" />
          </div>
        </div>

        <div class="row mt">
          <button id="start" class="btn">Start Burst</button>
          <button id="stop" class="btn" disabled>Stop</button>
          <label class="row subtle ml-auto" style="gap:6px;">
            <input id="narrate" type="checkbox" checked /> Narrate status (TTS)
          </label>
        </div>

        <div id="status" role="status" aria-live="polite"></div>

        <div class="row mt top">
          <video id="cam" playsinline muted></video>
          <div class="flex1">
            <div class="panelTitle">Result</div>
            <div id="output"></div>

            <div class="panelTitle mt">TTS</div>
            <div class="row">
              <button id="pauseTTS" class="btn">Pause</button>
              <button id="resumeTTS" class="btn">Resume</button>
              <button id="clearTTS" class="btn">Clear Queue</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Right: Transcript -->
      <section class="card">
        <div class="panelTitle">Dialogue (click ▶ to replay any line)</div>
        <ul id="transcript"></ul>
      </section>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
